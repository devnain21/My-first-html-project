<!-- SIMPLE JS (TIME) -->
<script>
function updateTime(){
  const now = new Date();
  document.getElementById("time").innerText =
    now.toLocaleTimeString() + " | " +
    now.toLocaleDateString("hi-IN");
}
setInterval(updateTime,1000);
updateTime();
</script>
